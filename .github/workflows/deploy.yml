# Deploy do App Interfone — doc completa: docs/DEPLOY-INFRA.md
# Push em main → SSH no Hetzner → git reset --hard → docker compose up -d --build.
# O app roda atrás do Traefik do Coolify (rede externa `coolify`): NÃO é publicado
# pelo Coolify, mas DEPENDE dele em runtime. Vars ficam em /opt/appinterfone/.env.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_PATH: /opt/appinterfone

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest on server
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && git fetch origin main && git reset --hard origin/main"

      - name: Build and restart
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose up -d --build --remove-orphans"

      # Espera o app responder de verdade. Antes este passo só imprimia o status
      # do container: um deploy quebrado passava com o job verde. /api/ready faz
      # SELECT no SQLite, então 200 aqui significa app no ar E banco acessível.
      - name: Health check
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'for i in $(seq 1 30); do
               code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3002/api/ready || true)
               if [ "$code" = "200" ]; then
                 echo "OK: /api/ready respondeu 200 (tentativa $i)"
                 docker ps --filter name=appinterfone --format "{{.Names}}: {{.Status}}"
                 exit 0
               fi
               sleep 5
             done
             echo "FALHA: /api/ready nao respondeu 200 em ~150s (ultimo codigo: $code)"
             docker ps --filter name=appinterfone --format "{{.Names}}: {{.Status}}"
             docker logs --tail 60 appinterfone
             exit 1'

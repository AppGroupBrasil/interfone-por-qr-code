# ═══════════════════════════════════════════════════════════════════════════
#  App Interfone — produção. Doc completa: docs/DEPLOY-INFRA.md
#  ⚠️  NÃO EXCLUIR O COOLIFY e NÃO remover a rede `coolify` nem as labels
#      Traefik abaixo: o `coolify-proxy` (Traefik) roteia este app + ~10 outros
#      via a rede externa `coolify`. Removê-los derruba TODOS os sites do servidor.
#  Deploy: git push em main → GitHub Actions (NÃO pelo Coolify). Vars em
#  /opt/appinterfone/.env no servidor. Push (campainha) via FIREBASE_SERVICE_ACCOUNT_JSON.
# ═══════════════════════════════════════════════════════════════════════════
services:
  appinterfone:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appinterfone
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://appinterfone.com.br,https://www.appinterfone.com.br,capacitor://localhost}
      - DEMO_MODE=${DEMO_MODE:-false}
      - SAMPLE_ACCOUNTS_ON_REGISTER=${SAMPLE_ACCOUNTS_ON_REGISTER:-false}
      # AWS SES (Email)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_REGION=${AWS_SES_REGION:-sa-east-1}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-naoresponda@appinterfone.com.br}
      - SES_FROM_NAME=${SES_FROM_NAME:-App Interfone}
      - APP_URL=${APP_URL:-https://appinterfone.com.br}
      # Firebase Cloud Messaging — preferir JSON inline via env (secret do Coolify).
      # Se vazio, cai para o arquivo em FIREBASE_SERVICE_ACCOUNT_PATH.
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      # Web Push (VAPID)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:contato@appinterfone.com.br}
    volumes:
      # Persist SQLite database
      - appinterfone_data:/app/data
      # Firebase service account — descomentar e garantir que o arquivo exista
      # para habilitar push notifications.
      # - ./server/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    networks:
      - coolify
    labels:
      # Traefik labels for Coolify
      - "traefik.enable=true"
      - "traefik.http.routers.appinterfone.rule=Host(`appinterfone.com.br`) || Host(`www.appinterfone.com.br`)"
      - "traefik.http.routers.appinterfone.entrypoints=https"
      - "traefik.http.routers.appinterfone.tls=true"
      - "traefik.http.routers.appinterfone.tls.certresolver=letsencrypt"
      - "traefik.http.services.appinterfone.loadbalancer.server.port=3001"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.appinterfone-http.rule=Host(`appinterfone.com.br`) || Host(`www.appinterfone.com.br`)"
      - "traefik.http.routers.appinterfone-http.entrypoints=http"
      - "traefik.http.routers.appinterfone-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # www → non-www redirect
      - "traefik.http.routers.appinterfone-www.rule=Host(`www.appinterfone.com.br`)"
      - "traefik.http.routers.appinterfone-www.entrypoints=https"
      - "traefik.http.routers.appinterfone-www.tls=true"
      - "traefik.http.routers.appinterfone-www.middlewares=appinterfone-redirect-www"
      - "traefik.http.middlewares.appinterfone-redirect-www.redirectregex.regex=^https://www\\.appinterfone\\.com\\.br/(.*)"
      - "traefik.http.middlewares.appinterfone-redirect-www.redirectregex.replacement=https://appinterfone.com.br/$${1}"
      - "traefik.http.middlewares.appinterfone-redirect-www.redirectregex.permanent=true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  # ⚠️ OBRIGATÓRIA — rede do Coolify onde vive o `coolify-proxy` (Traefik) que
  # serve este app e ~10 outros. NÃO remover. Ver docs/DEPLOY-INFRA.md.
  coolify:
    external: true

volumes:
  appinterfone_data:
    driver: local
